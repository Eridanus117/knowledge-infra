name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal --target ${{ matrix.target }} --no-self-update
      - name: Test locked workspace
        run: cargo +1.97.0 test --workspace --locked --target ${{ matrix.target }}
