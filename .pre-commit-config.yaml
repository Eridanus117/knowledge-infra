# 装: uv tool install pre-commit --with pre-commit-uv
# 心智: 本地提速反馈; 真正强制 gate 在 CI。
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: "0.11.19"
    hooks:
      - id: uv-lock
  # KB commit gate. 接到既有 pre-commit 框架而非 lefthook: 装 lefthook 会
  # 改名 pre-commit hook 为 .old、静默废掉 ruff/uv 检查。rhizome check 是 domain-aware
  # 的(只校验 KB 域内变更 md), 域外文件跳过。
  - repo: local
    hooks:
      - id: rhizome-check
        name: rhizome check (KB commit gate)
        entry: rhizome check
        language: system
        files: \.md$
